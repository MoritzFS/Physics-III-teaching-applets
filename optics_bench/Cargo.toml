[package]
name = "optics_bench"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
env_logger = "0.11.11"
glam = { version = "0.33.9", features = ["bytemuck", "serde"] }
log = "0.4.34"
png = "0.18.1"
rayon = "1.12.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
transpose = "0.2.3"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
