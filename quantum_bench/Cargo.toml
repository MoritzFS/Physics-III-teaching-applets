# Quantum Bench: a cargo workspace.
#
#   crates/qb_core      shared shell, numerics, widgets (FROZEN after the foundation)
#   crates/qb_wave1d    tab "1D waves"   (+ bin wave1d_solo)
#   crates/qb_box2d     tab "2D box"     (+ bin box2d_solo)
#   crates/qb_hydrogen  tab "Hydrogen"   (+ bin hydrogen_solo)
#   crates/qb_spin      tab "Spin"       (+ bin spin_solo)
#   app                 the full app (bin quantum_bench)
#
# This file and every Cargo.toml are frozen: all dependencies the tabs may need
# are already listed. See DEVELOPING.md.

[workspace]
resolver = "3"
members = [
    "crates/qb_core",
    "crates/qb_wave1d",
    "crates/qb_box2d",
    "crates/qb_hydrogen",
    "crates/qb_spin",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
qb_core = { path = "crates/qb_core" }
qb_wave1d = { path = "crates/qb_wave1d" }
qb_box2d = { path = "crates/qb_box2d" }
qb_hydrogen = { path = "crates/qb_hydrogen" }
qb_spin = { path = "crates/qb_spin" }

eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.33.9", features = ["bytemuck", "serde"] }
num-complex = { version = "0.4.6", features = ["serde", "bytemuck"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.34"
web-time = "1.1.0"

# native only (cfg-gated in the crates that use them)
rayon = "1.12.0"
env_logger = "0.11.11"
png = "0.18.1"

# web only
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = [
    "Document",
    "Element",
    "History",
    "HtmlCanvasElement",
    "HtmlElement",
    "Location",
    "Window",
] }

# tests only
naga = { version = "30.0.1", features = ["wgsl-in"] }

# Native release builds stay quick to link (the scene agents rebuild often).
[profile.release]
opt-level = 3
debug = false

# The web build (Trunk, see index.html) uses this profile: smaller, faster wasm.
[profile.web]
inherits = "release"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
