[package]
name = "stat_phys_bench"
version = "0.1.0"
edition = "2024"

[dependencies]
# glow (WebGL 2 in the browser): the app only draws 2D shapes, so it runs without WebGPU
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
log = "0.4.34"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.18.1"

# winit needs a windowing backend on Linux (used by CI for the native tests).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = [
    "Document",
    "Element",
    "History",
    "HtmlCanvasElement",
    "Location",
    "Window",
] }

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
